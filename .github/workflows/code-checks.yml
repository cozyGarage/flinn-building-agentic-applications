name: Check Code Integrity

on:
  pull_request:
    branches: [main, develop]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: |
          poetry install --with dev,eval -v

      - name: Check for outstanding code cleanup
        run: |
          poetry run poe clean

      - name: Run code quality checks
        run: |
          poetry run poe check

      - name: Run unit tests
        run: |
          PYTHONPATH=. poetry run poe test:unit
