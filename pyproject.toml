[tool.poetry]
name = "flinn-md-building-agentic-applications"
version = "0.0.1"
description = ""
authors = [
    "FlinnComply"
]
readme = "README.md"
packages = [
    {include = "src"}
]

[tool.poetry.dependencies]
python = ">=3.13.0,<3.14.0"
langchain = ">=1.1.0,<2.0.0"
langchain-core = ">=1.0.0,<2.0.0"
pydantic = ">=2.12.5"
python-dotenv = ">=1.2.1"
typing_extensions = ">=4.14.1"
langgraph = "^1.0.4"
langchain-openai = "^1.1.0"
langchain-anthropic = "^1.2.0"
langgraph-prebuilt = "^1.0.5"
langgraph-cli = "^0.4.7"
langgraph-api = "^0.5.27"
langchain-community = "^0.4.1"
duckduckgo-search = "^8.1.1"
ddgs = "^9.9.2"
python-json-logger = "^4.0.0"
tiktoken = "^0.12.0"


[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
flake8 = "^7.2.0"
mypy = "^1.15.0"
pytest = ">=9.0.1,<10.0.0"
poethepoet = ">=0.38.0,<0.39.0"
click = ">=8.3.1"
watchfiles = ">=1.1.1"
vulture = "^2.14"
ipykernel = "^7.1.0"
pre-commit = "^4.5.0"

[tool.poetry.group.eval]
optional = true

[tool.poetry.group.eval.dependencies]
tqdm = "4.67.1"
soupsieve = "2.7"

[tool.black]
line-length = 110

[tool.mypy]
strict = true  # or whatever your base config is
# NOTE: below might not be needed
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "langchain_core.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langsmith.*"
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
ignore = [
    "E3",   # regarding blank lines
    "E501", # "line too long"
    "W1",   # regarding tabs
    "W2",   # regarding end of file whitespaces
    "W3",   # regarding end of file whitespaces
]
exclude = [".git", "__pycache__", ".venv", "build", "dist"]
max-complexity = 10

# Narrow linters & checks to only scan the repository source & tests folders
[tool.poe.tasks]
clean = [
    { cmd = "black src test" },
    { cmd = "mypy --install-types --non-interactive src" }
]
check = [
    { cmd = "black --check src test" },
    { cmd = "flake8 src test" },
    { cmd = "mypy src" },
    { cmd = "vulture src/ --min-confidence 80"}
]
# Note: run with PYTHONPATH=. poetry run poe test:unit
"test:unit" = "pytest test/unit"
"test:integration" = "pytest test/integration"

# Run full development workflow: clean, check, then test
dev = ["clean", "check", "test:unit"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
